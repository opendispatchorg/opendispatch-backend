name: opendispatch

services:
  postgres:
    # imresamu/postgis rather than postgis/postgis: the latter publishes amd64 only, so it
    # requires emulation on Apple Silicon. This one is the multi-arch build (amd64 +
    # arm64) from a PostGIS Docker maintainer, so local dev and amd64 CI share one image.
    image: imresamu/postgis:17-3.6
    container_name: opendispatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opendispatch
      POSTGRES_USER: opendispatch
      POSTGRES_PASSWORD: opendispatch
    ports:
      # Host port 5433, not 5432: a developer machine commonly already runs a local
      # Postgres on the default port, and binding it would fail `make up`.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendispatch -d opendispatch"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The API itself, and the one-shot that applies the schema before it. Both are behind the `app`
  # profile, so `make up` still means "just the database" for a developer running the host from
  # their own SDK — `docker compose --profile app up` is what runs the whole system in containers.
  #
  # This is a working deployment shape rather than a production one: it holds the same committed
  # development credentials the compose database does, which the host's own startup guards refuse
  # outside Development (see DevelopmentDefaults). A real deployment supplies its own
  # Database__ConnectionString and Jwt__SigningKey and runs as a non-Development environment.
  migrate:
    profiles: ["app"]
    build: .
    image: opendispatch-api:local
    command: ["migrate"]
    environment:
      # Development for the same reason the api service below is: this profile runs against the
      # credentials this repository commits, and the host refuses those anywhere else.
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: "Host=postgres;Port=5432;Database=opendispatch;Username=opendispatch;Password=opendispatch"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The SignalR backplane. Only the `app` profile starts it, and only because that profile is the
  # one shape in this repository where there could be more than one API: without it, a dispatch
  # board connected to one instance never hears about a change made through another.
  redis:
    profiles: ["app"]
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    image: opendispatch-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: "Host=postgres;Port=5432;Database=opendispatch;Username=opendispatch;Password=opendispatch"
      SignalR__Redis: "redis:6379"
    ports:
      - "8080:8080"
    volumes:
      - attachments:/var/lib/opendispatch/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        # The schema is applied before anything serves, and the API starts only if it worked —
        # which is the whole reason migrating is a verb with an exit code rather than something
        # the host does to itself while starting.
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
    name: opendispatch-pgdata
  attachments:
    name: opendispatch-attachments
