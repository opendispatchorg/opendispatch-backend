name: CI

# Commits landing on main, and every pull request. A PR from a feature branch fires
# only the pull_request trigger, so nothing is built twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # global.json pins the SDK feature band, so CI and local machines resolve the
          # same analyzer set. With warnings-as-errors on, an SDK drift would otherwise
          # turn new analyzer rules into build failures that nobody can reproduce.
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore OpenDispatch.sln

      # Warnings are errors via Directory.Build.props, so this step fails on any warning.
      # The gate is deliberately not repeated here: one source of truth cannot drift.
      - name: Build
        run: dotnet build OpenDispatch.sln --configuration Release --no-restore

      # Unit + integration. The integration category starts a PostGIS container through
      # Testcontainers, which works on ubuntu-latest because Docker is preinstalled.
      # The build above already produced Release output, so this rebuild is a no-op.
      - name: Test
        run: make test CONFIGURATION=Release

  # Regenerate the shared contract package and fail if it differs from what is committed.
  # This is what makes a backend change a client compile error instead of a runtime surprise:
  # the generated TypeScript cannot fall behind the C# and the endpoints without turning a
  # build red first. A separate job because a red contract is a different problem from a red
  # test, and the two say so before anyone opens the log.
  contract-drift:
    name: Contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The OpenAPI half of the package is generated by openapi-typescript, and the
          # result is committed — so the toolchain that produces it is pinned as tightly as
          # the compiler that produces the rest.
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Regenerates, type-checks the result, then diffs it against the checkout. The same
      # target a developer runs locally, so a failure here is reproducible in one command.
      - name: Regenerate and diff
        run: make check-contracts
